<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <title>Slides of Cards</title>
</head>
<body>
  <div class="container">
    <h1 id="main-title">Popular Photo Camera</h1>
    <div
        class="slide hidden vis"
        style="
            background-image: url('img/fujifilm.jpeg');">
    <h3>Fujifilm</h3>
    </div>
    <div
        class="slide hidden vis"
        style="
            background-image: url('img/canon.jpeg');">
      <h3>Canon</h3>
    </div>
    <div
        class="slide hidden vis"
        style="
            background-image: url('img/sony.jpeg')">
      <h3>Sony</h3>
    </div>
    <div
        class="slide hidden vis"
        style="
            background-image: url('img/leica.jpeg')">
      <h3>Leica</h3>
    </div>
    <div
        class="slide hidden vis"
        style="
            background-image: url('img/nikon.jpeg')">
    <h3>Nikon</h3>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
